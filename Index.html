<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        .game {
            margin-top: 100px;
        }

        h1 {
            font-size: 35px;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 5px;
            justify-content: center;
        }

        .cell {
            width: 90px;
            height: 90px;
            background: white;
            border: 2px solid black;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background: #ddd;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #homeBtn {
            display: none;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🎮 Tic Tac Toe</h1>

    <div id="status">Player X's Turn</div>

    <div class="board">

        <button class="cell" onclick="play(0)"></button>
        <button class="cell" onclick="play(1)"></button>
        <button class="cell" onclick="play(2)"></button>

        <button class="cell" onclick="play(3)"></button>
        <button class="cell" onclick="play(4)"></button>
        <button class="cell" onclick="play(5)"></button>

        <button class="cell" onclick="play(6)"></button>
        <button class="cell" onclick="play(7)"></button>
        <button class="cell" onclick="play(8)"></button>

    </div>

    <div class="buttons">

        <button onclick="restartGame()">🔄 Restart</button>

        <button id="homeBtn" onclick="goHome()">🏠 Home</button>

    </div>

</div>


<script>

let board = ["","","","","","","","",""];
let currentPlayer = "X";
let gameOver = false;

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");
const homeBtn = document.getElementById("homeBtn");

const winningPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];


function play(index) {

    if (board[index] !== "" || gameOver) {
        return;
    }

    board[index] = currentPlayer;
    cells[index].textContent = currentPlayer;

    checkWinner();
}


function checkWinner() {

    for (let pattern of winningPatterns) {

        let a = pattern[0];
        let b = pattern[1];
        let c = pattern[2];

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            status.textContent =
                "🎉 Player " + currentPlayer + " Wins!";

            gameOver = true;

            homeBtn.style.display = "inline-block";

            return;
        }
    }


    if (!board.includes("")) {

        status.textContent = "🤝 Game Draw!";

        gameOver = true;

        homeBtn.style.display = "inline-block";

        return;
    }


    currentPlayer = currentPlayer === "X" ? "O" : "X";

    status.textContent =
        "Player " + currentPlayer + "'s Turn";
}


function restartGame() {

    board = ["","","","","","","","",""];
    currentPlayer = "X";
    gameOver = false;

    cells.forEach(function(cell) {
        cell.textContent = "";
    });

    status.textContent = "Player X's Turn";

    homeBtn.style.display = "none";
}


function goHome() {

    restartGame();

    status.textContent = "Player X's Turn";
}

</script>

</body>
</html>
