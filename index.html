<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
        }

        .screen {
            margin-top: 70px;
        }

        h1 {
            font-size: 36px;
        }

        button {
            cursor: pointer;
        }

        .menu button,
        .controls button {
            display: block;
            margin: 15px auto;
            padding: 12px 25px;
            font-size: 17px;
            border: none;
            border-radius: 6px;
            background: black;
            color: white;
        }

        .menu button:hover,
        .controls button:hover {
            background: #333;
        }

        #gameScreen {
            display: none;
        }

        #status {
            font-size: 20px;
            font-weight: bold;
            margin: 20px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 5px;
            justify-content: center;
        }

        .cell {
            width: 90px;
            height: 90px;
            background: white;
            border: 2px solid black;
            font-size: 45px;
            font-weight: bold;
        }

        .cell:hover {
            background: #ddd;
        }

        .controls button {
            display: inline-block;
            margin: 20px 5px;
        }
    </style>
</head>

<body>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen">

    <h1>🎮 Tic Tac Toe</h1>

    <p>Select Game Mode</p>

    <div class="menu">
        <button onclick="startGame('computer')">
            🤖 Play with Computer
        </button>

        <button onclick="startGame('2player')">
            👥 2 Players
        </button>
    </div>

</div>


<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">

    <h1>🎮 Tic Tac Toe</h1>

    <div id="status">Your Turn (X)</div>

    <div class="board">

        <button class="cell" onclick="makeMove(0)"></button>
        <button class="cell" onclick="makeMove(1)"></button>
        <button class="cell" onclick="makeMove(2)"></button>

        <button class="cell" onclick="makeMove(3)"></button>
        <button class="cell" onclick="makeMove(4)"></button>
        <button class="cell" onclick="makeMove(5)"></button>

        <button class="cell" onclick="makeMove(6)"></button>
        <button class="cell" onclick="makeMove(7)"></button>
        <button class="cell" onclick="makeMove(8)"></button>

    </div>

    <div class="controls">

        <button onclick="restartGame()">🔄 Restart</button>

        <button onclick="goHome()">🏠 Home</button>

    </div>

</div>


<script>

let board = ["","","","","","","","",""];

let currentPlayer = "X";
let gameMode = "";
let gameOver = false;

const cells = document.querySelectorAll(".cell");
const status = document.getElementById("status");

const winningPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];


// START GAME
function startGame(mode) {

    gameMode = mode;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    restartGame();
}


// MAKE MOVE
function makeMove(index) {

    if (board[index] !== "" || gameOver) {
        return;
    }

    // COMPUTER MODE
    if (gameMode === "computer") {

        if (currentPlayer !== "X") {
            return;
        }

        board[index] = "X";
        cells[index].textContent = "X";

        if (checkGame("X")) {
            status.textContent = "🎉 You Win!";
            gameOver = true;
            return;
        }

        if (!board.includes("")) {
            status.textContent = "🤝 Game Draw!";
            gameOver = true;
            return;
        }

        currentPlayer = "O";
        status.textContent = "🤖 Computer's Turn...";

        setTimeout(computerMove, 500);

    }

    // 2 PLAYER MODE
    else {

        board[index] = currentPlayer;
        cells[index].textContent = currentPlayer;

        if (checkGame(currentPlayer)) {

            status.textContent =
                "🎉 Player " + currentPlayer + " Wins!";

            gameOver = true;
            return;
        }

        if (!board.includes("")) {

            status.textContent = "🤝 Game Draw!";
            gameOver = true;
            return;
        }

        currentPlayer =
            currentPlayer === "X" ? "O" : "X";

        status.textContent =
            "Player " + currentPlayer + "'s Turn";
    }
}


// COMPUTER MOVE
function computerMove() {

    if (gameOver) {
        return;
    }

    let emptyCells = [];

    for (let i = 0; i < board.length; i++) {

        if (board[i] === "") {
            emptyCells.push(i);
        }
    }

    let randomMove =
        emptyCells[
            Math.floor(Math.random() * emptyCells.length)
        ];

    board[randomMove] = "O";
    cells[randomMove].textContent = "O";

    if (checkGame("O")) {

        status.textContent = "🤖 Computer Wins!";
        gameOver = true;
        return;
    }

    if (!board.includes("")) {

        status.textContent = "🤝 Game Draw!";
        gameOver = true;
        return;
    }

    currentPlayer = "X";
    status.textContent = "Your Turn (X)";
}


// CHECK WIN
function checkGame(player) {

    for (let pattern of winningPatterns) {

        let a = pattern[0];
        let b = pattern[1];
        let c = pattern[2];

        if (
            board[a] === player &&
            board[b] === player &&
            board[c] === player
        ) {
            return true;
        }
    }

    return false;
}


// RESTART
function restartGame() {

    board = ["","","","","","","","",""];

    currentPlayer = "X";
    gameOver = false;

    cells.forEach(function(cell) {
        cell.textContent = "";
    });

    if (gameMode === "computer") {
        status.textContent = "Your Turn (X)";
    } else {
        status.textContent = "Player X's Turn";
    }
}


// HOME
function goHome() {

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("homeScreen").style.display = "block";

    restartGame();
}

</script>

</body>
</html>
